[package]
name = "smart-archive-rar"
version = "0.3.4"
edition = "2021"
description = "RAR5 archive creation for Smart Archive — napi-rs binding around the rar5 library"
license = "BSD-2-Clause"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
# Development: local checkout. Before release, point back at the pushed
# revision on codeberg (see the previous `rev = "d8f0f63"` form).
rar5 = { path = "C:/Users/yuan/Desktop/rar-rs", features = ["parallel", "simd"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
