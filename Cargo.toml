[package]
name = "smart-archive-rar"
version = "0.1.0"
edition = "2021"
description = "RAR5 archive creation for Smart Archive — napi-rs binding around the rar5 library"
license = "BSD-2-Clause"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3"
napi-derive = "3"
rar5 = { git = "https://codeberg.org/yjdyamv/rar-rs.git", rev = "b8493303c0ffd0e20f619a6036c8780daa042775" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
